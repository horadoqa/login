<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hora do QA</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="./assets/images/logo.png">
    <script src="./assets/js/login.js"></script>
</head>
<body>
    <div class="image-container">
        <img src="./assets/images/logo.png" alt="Hora do QA">
        <h2>Hora do QA</h2>
    </div>

    <div class="login-container">
        <h2>LOGIN</h2>
        <input type="email" id="username" placeholder="E-mail" required>
        <input type="password" id="password" placeholder="Senha" required>
        <button type="submit" id="button" onclick="login()">Entrar</button>
        <p id="error-message" class="error"></p>
        <p style="margin-top:20px;color:#FFF;font-size:.9rem;">
            Não possui uma conta?
            <a href="./pages/cadastro.html" style="color:#60a5fa;text-decoration:none;font-weight:bold;">
                Criar conta
            </a>
        </p>
    </div>

</body>
</html>
