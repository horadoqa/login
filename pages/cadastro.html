<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hora do QA — Cadastro</title>

    <!-- Tipografia -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Newsreader:ital,wght@1,400;1,500;1,600&display=swap"
        rel="stylesheet">

    <link rel="icon" type="image/png" href="../assets/images/logo.png">

    <link rel="stylesheet" href="../assets/css/auth.css">

</head>

<body>
    <main class="page">

        <!-- IDENTIDADE DA MARCA -->
        <section class="brand" aria-label="Hora do QA">

            <div class="brand-mark">
                <img src="../assets/images/logo.png" alt="Logo Hora do QA">
            </div>

            <div class="brand-content">

                <span class="brand-kicker">
                    QUALITY / TESTING
                </span>

                <h1>
                    Hora do <em>QA</em>
                </h1>

                <p class="brand-description">
                    Testar. Encontrar. Entender.
                </p>

            </div>

        </section>


        <!-- CADASTRO -->
        <section class="login-container" aria-labelledby="register-title">

            <!-- CABEÇALHO TÉCNICO -->
            <div class="login-header">

                <div class="status">
                    <span class="status-dot"></span>
                    <span>STATUS: READY</span>
                </div>

                <span class="build">
                    REGISTER_001
                </span>

            </div>


            <!-- TÍTULO -->
            <div class="login-title">

                <span class="eyebrow">
                    ACCESS / 02
                </span>

                <h2 id="register-title">
                    Criar conta
                </h2>

                <p>
                    Crie seu acesso ao espaço de testes.
                </p>

            </div>


            <!-- FORMULÁRIO -->
            <form id="registerForm">

                <div class="field">

                    <label for="name">
                        NOME COMPLETO
                    </label>

                    <input type="text" id="name" name="name" placeholder="Seu nome" autocomplete="name" required>

                </div>


                <div class="field">

                    <label for="email">
                        E-MAIL
                    </label>

                    <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email"
                        required>

                </div>


                <div class="field">

                    <label for="password">
                        SENHA
                    </label>

                    <input type="password" id="password" name="password" placeholder="Mínimo de 8 caracteres"
                        minlength="8" autocomplete="new-password" required>

                </div>


                <div class="field">

                    <label for="confirmPassword">
                        CONFIRMAR SENHA
                    </label>

                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repita sua senha"
                        minlength="8" autocomplete="new-password" required>

                </div>


                <button type="submit">

                    <span>
                        Criar conta
                    </span>

                    <span class="button-arrow">
                        →
                    </span>

                </button>

            </form>


            <!-- MENSAGEM DO JAVASCRIPT -->
            <p id="message" class="error" role="alert"></p>


            <!-- DIVISOR -->
            <div class="divider">

                <span></span>

                <small>
                    EXISTING USER
                </small>

                <span></span>

            </div>


            <!-- LOGIN -->
            <p class="register">

                Já possui uma conta?

                <a href="../index.html">
                    Fazer login
                </a>

            </p>


            <!-- RODAPÉ TÉCNICO -->
            <div class="login-footer">

                <span>
                    QA_SYSTEM
                </span>

                <span>
                    v1.0.0
                </span>

            </div>

        </section>


        <!-- RODAPÉ -->
        <footer class="page-footer">

            <span>
                <strong>PASS</strong>
                // QUALITY MATTERS
            </span>

        </footer>

    </main>


    <script src="../assets/js/cadastro.js"></script>

</body>

</html>
